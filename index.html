<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11100f" />
  <meta name="description" content="嫣ღ｜個人品牌・社群經營・小賣場" />
  <title>嫣ღ｜個人品牌・社群經營・小賣場</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;800;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f0e0d;
      --panel: rgba(255,255,255,.82);
      --panel-strong: rgba(255,255,255,.94);
      --text: #191715;
      --muted: #746f69;
      --shadow: 0 18px 50px rgba(0,0,0,.16);
      --radius: 24px;
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.08), transparent 34%),
        linear-gradient(180deg, #151311 0%, #0d0c0b 100%);
      font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
      padding-bottom: 112px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.025),
          transparent 28%,
          rgba(255,255,255,.02)
        );
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      min-height: 100vh;
      background: #ece8e2;
      box-shadow: 0 0 70px rgba(0,0,0,.28);
      position: relative;
      overflow: hidden;
    }

    /* =========================
       主視覺
    ========================== */

    .hero {
      position: relative;
      height: clamp(520px, 76vh, 760px);
      min-height: 520px;
      overflow: hidden;
      background: #171512;
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 32%;
      transform: scale(1.015);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.10) 0%,
          rgba(0,0,0,.08) 40%,
          rgba(0,0,0,.48) 78%,
          rgba(18,16,14,.90) 100%
        ),
        linear-gradient(
          90deg,
          rgba(0,0,0,.10),
          transparent 46%,
          rgba(0,0,0,.08)
        );
    }

    .hero-copy {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 42px;
      text-align: center;
      color: #fff;
      padding: 0 24px;
      animation: rise .8s ease both;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .34em;
      opacity: .82;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      font-size: clamp(38px, 8vw, 60px);
      line-height: 1;
      letter-spacing: .08em;
      text-shadow: 0 5px 20px rgba(0,0,0,.22);
    }

    .subtitle {
      margin-top: 13px;
      font-family: "Noto Serif TC", serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .16em;
      opacity: .95;
    }

    /* =========================
       內容區
    ========================== */

    .content {
      position: relative;
      z-index: 3;
      margin-top: -8px;
      padding: 30px 18px 46px;
      background:
        linear-gradient(
          180deg,
          #ece8e2 0%,
          #f3efe9 50%,
          #ebe6df 100%
        );
    }

    .intro {
      text-align: center;
      max-width: 540px;
      margin: 0 auto 20px;
      color: #6d665f;
      font-size: 12px;
      letter-spacing: .16em;
    }

    .links {
      display: grid;
      gap: 14px;
      max-width: 620px;
      margin: 0 auto;
    }

    /* =========================
       卡片
    ========================== */

    .card {
      display: grid;
      grid-template-columns: 68px 1fr auto;
      align-items: center;
      gap: 14px;

      min-height: 92px;
      padding: 12px 16px 12px 12px;

      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.94),
          rgba(255,255,255,.74)
        );

      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.8);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      text-decoration: none;
      color: inherit;

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease;

      animation: rise .65s ease both;
    }

    .card:nth-child(2) {
      animation-delay: .05s;
    }

    .card:nth-child(3) {
      animation-delay: .10s;
    }

    .card:nth-child(4) {
      animation-delay: .15s;
    }

    .card:nth-child(5) {
      animation-delay: .20s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 60px rgba(0,0,0,.20);
      background: var(--panel-strong);
    }

    .card:active {
      transform: scale(.985);
    }

    .icon-wrap {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 7px 18px rgba(0,0,0,.10);
      flex-shrink: 0;
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .icon-wrap.contain img {
      object-fit: contain;
      padding: 3px;
    }

    .card-copy {
      min-width: 0;
    }

    .card-title {
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: .04em;
      line-height: 1.25;
      margin-bottom: 5px;
    }

    .card-note {
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
      letter-spacing: .025em;
    }

    .arrow {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.08);
      display: grid;
      place-items: center;
      font-size: 18px;
      color: #4f4a45;
      background: rgba(255,255,255,.58);
      flex-shrink: 0;
    }

    .footer-note {
      text-align: center;
      margin-top: 26px;
      color: #8c857e;
      font-size: 10px;
      letter-spacing: .14em;
    }

    /* =========================
       底部固定 LINE
    ========================== */

    .sticky {
      position: fixed;
      left: 50%;
      bottom: var(--safe-bottom);
      transform: translateX(-50%);

      width: min(calc(100% - 28px), 650px);
      z-index: 20;

      padding: 8px;
      border-radius: 22px;

      background: rgba(20,18,16,.62);
      box-shadow: 0 16px 50px rgba(0,0,0,.34);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,.16);
    }

    .sticky a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-height: 58px;
      border-radius: 16px;

      text-decoration: none;
      color: #171411;

      background:
        linear-gradient(
          180deg,
          #fff 0%,
          #f2eee8 100%
        );

      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      letter-spacing: .10em;

      box-shadow: inset 0 1px 0 #fff;

      transition: transform .18s ease;
    }

    .sticky a:active {
      transform: scale(.985);
    }

    .line-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #06c755;
      box-shadow: 0 0 0 5px rgba(6,199,85,.12);
    }

    /* =========================
       動畫
    ========================== */

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       手機版
    ========================== */

    @media (max-width: 520px) {
      .page {
        width: 100%;
      }

      .hero {
        height: 69vh;
        min-height: 520px;
      }

      .hero img {
        object-position: center 34%;
      }

      .hero-copy {
        bottom: 34px;
      }

      .content {
        padding: 26px 14px 38px;
      }

      .card {
        grid-template-columns: 62px 1fr auto;
        min-height: 84px;
        padding: 11px 13px 11px 11px;
        border-radius: 21px;
        gap: 12px;
      }

      .icon-wrap {
        width: 62px;
        height: 62px;
        border-radius: 16px;
      }

      .card-title {
        font-size: 17px;
      }

      .card-note {
        font-size: 11.5px;
      }

      .arrow {
        width: 30px;
        height: 30px;
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <!--
    背景音樂
    不顯示播放器
    自動循環
  -->
  <audio
    id="bgMusic"
    preload="auto"
    loop
    playsinline
  >
    <source
      src="soundoffreedom-lo-fi-rampb-vibe-405852.mp3"
      type="audio/mpeg"
    >
  </audio>


  <script>
    (() => {

      const music = document.getElementById("bgMusic");

      if (!music) return;

      /*
        音量
        0.28 = 28%
      */
      music.volume = 0.28;


      /*
        嘗試播放
      */
      const tryPlay = () => {

        const playPromise = music.play();

        if (
          playPromise &&
          typeof playPromise.catch === "function"
        ) {

          playPromise.catch(() => {
            /*
              Safari / Chrome
              如果禁止自動播放，
              這裡不顯示任何錯誤。
            */
          });

        }

      };


      /*
        網頁載入完成後
        立即嘗試播放
      */
      window.addEventListener(
        "load",
        tryPlay,
        { once: true }
      );


      /*
        部分瀏覽器會禁止
        「完全沒有使用者操作」
        的有聲音自動播放。

        如果第一次自動播放被擋，
        使用者第一次點擊、
        觸碰或滑動頁面時，
        就會立即開始播放。

        畫面不會出現音樂按鈕。
      */
      const unlockMusic = () => {

        tryPlay();

        [
          "touchstart",
          "pointerdown",
          "click",
          "keydown"
        ].forEach((eventName) => {

          document.removeEventListener(
            eventName,
            unlockMusic,
            true
          );

        });

      };


      [
        "touchstart",
        "pointerdown",
        "click",
        "keydown"
      ].forEach((eventName) => {

        document.addEventListener(
          eventName,
          unlockMusic,
          {
            capture: true,
            once: true
          }
        );

      });


      /*
        從 Instagram / LINE /
        其他 App 回到網站時，
        如果音樂被暫停，
        再嘗試恢復播放。
      */
      document.addEventListener(
        "visibilitychange",
        () => {

          if (
            !document.hidden &&
            music.paused
          ) {

            tryPlay();

          }

        }
      );

    })();
  </script>
